<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT 管理員後台 - 設備借用與黑名單管理</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖標庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部管理員專用導航 -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-lg">
          <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-lg font-bold tracking-tight">IT 設備借用管理後台</h1>
            <span class="text-[10px] bg-amber-400 text-amber-950 font-bold px-2 py-0.5 rounded">Admin Portal</span>
          </div>
          <p class="text-xs text-slate-400">借還審核 · 欠取機統計 · 物資調配</p>
        </div>
      </div>

      <!-- 右側：登入身分與前台快速連結 -->
      <div class="flex items-center space-x-3 text-xs">
        <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> 返回預約前台
        </a>
        <div id="adminAuthInfo" class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <i class="fa-solid fa-user-shield text-indigo-400"></i>
          <span id="adminEmailDisplay" class="text-slate-300 font-medium">驗證身分中...</span>
          <button onclick="logout()" class="text-rose-400 hover:text-rose-300 ml-1">登出</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 權限不足提示遮罩 (未授權時顯示) -->
  <div id="accessDeniedBlock" class="max-w-lg mx-auto my-16 bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
    <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-2xl">
      <i class="fa-solid fa-lock"></i>
    </div>
    <h2 class="text-xl font-bold text-slate-800">需要管理員身分</h2>
    <p class="text-sm text-slate-600">請確認您已登入並名列於資料庫管理員名單中。</p>
    <div class="pt-2 flex justify-center gap-3">
      <button onclick="loginWithGoogle()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">使用 Google 登入</button>
      <a href="index.html" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-300 transition">返回前台</a>
    </div>
  </div>

  <!-- 主控制台 (通過驗證後顯示) -->
  <main id="adminMainContent" class="hidden max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- 標籤頁切換 Tab -->
    <div class="flex border-b border-slate-200 space-x-4">
      <button onclick="switchTab('tab-bookings')" id="tabBtn-bookings" class="tab-btn pb-3 px-2 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2">
        <i class="fa-solid fa-list-check"></i> 借還狀態審核
      </button>
      <button onclick="switchTab('tab-teachers')" id="tabBtn-teachers" class="tab-btn pb-3 px-2 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-user-xmark"></i> 教師欠取與黑名單
      </button>
      <button onclick="switchTab('tab-resources')" id="tabBtn-resources" class="tab-btn pb-3 px-2 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2">
        <i class="fa-solid fa-sliders"></i> 全校物資總量設定
      </button>
    </div>

    <!-- ================= 頁籤 1：借還審核 ================= -->
    <section id="tab-bookings" class="tab-content space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-xs border border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
          <label class="text-xs font-semibold text-slate-600">審核日期：</label>
          <input type="date" id="adminQueryDate" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-indigo-500">
          <button onclick="loadAdminBookings()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg transition">
            <i class="fa-solid fa-rotate-right mr-1"></i> 刷新記錄
          </button>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <span class="px-2 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded">待取機: <b id="countPending">0</b></span>
          <span class="px-2 py-1 bg-blue-50 text-blue-700 border border-blue-200 rounded">借出中: <b id="countBorrowed">0</b></span>
          <span class="px-2 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded">已歸還: <b id="countReturned">0</b></span>
          <span class="px-2 py-1 bg-rose-50 text-rose-700 border border-rose-200 rounded">欠取機: <b id="countMissed">0</b></span>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-xs border border-slate-200 overflow-hidden">
        <table class="w-full text-left text-xs text-slate-600">
          <thead class="bg-slate-50 text-slate-700 uppercase font-semibold border-b border-slate-200">
            <tr>
              <th class="py-3 px-4">課節</th>
              <th class="py-3 px-4">借用老師</th>
              <th class="py-3 px-4">設備 / 數量</th>
              <th class="py-3 px-4">班別 / 科目 / 地點</th>
              <th class="py-3 px-4">登記者電郵</th>
              <th class="py-3 px-4">目前狀態</th>
              <th class="py-3 px-4 text-center">狀態審核操作</th>
            </tr>
          </thead>
          <tbody id="adminBookingsTable" class="divide-y divide-slate-100">
            <!-- 動態生成 -->
          </tbody>
        </table>
        <div id="adminEmptyBookings" class="hidden text-center py-12 text-slate-400">
          <p class="text-sm">本日暫無任何借用記錄</p>
        </div>
      </div>
    </section>

    <!-- ================= 頁籤 2：教師欠取與黑名單 ================= -->
    <section id="tab-teachers" class="tab-content hidden space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- 左側：快速新增教師 -->
        <div class="bg-white p-5 rounded-xl shadow-xs border border-slate-200 space-y-4 h-fit">
          <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b pb-2">
            <i class="fa-solid fa-user-plus text-indigo-600"></i> 新增教師名單
          </h3>
          <form onsubmit="addNewTeacher(event)" class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">教師姓名 <span class="text-rose-500">*</span></label>
              <input type="text" id="newTeacherName" required placeholder="如：張老師" class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 rounded-lg transition">
              確認新增至名單
            </button>
          </form>
        </div>

        <!-- 右側：欠取統計與黑名單清單 -->
        <div class="md:col-span-2 bg-white p-5 rounded-xl shadow-xs border border-slate-200 space-y-4">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-users-slash text-rose-600"></i> 全校教師欠取統計與停借管理
            </h3>
            <span id="suspendedCount" class="text-xs bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-medium">0 位停借中</span>
          </div>

          <div class="overflow-x-auto max-h-[500px]">
            <table class="w-full text-left text-xs text-slate-600">
              <thead class="bg-slate-50 text-slate-700 uppercase font-semibold sticky top-0">
                <tr>
                  <th class="py-2.5 px-3">老師姓名</th>
                  <th class="py-2.5 px-3">累計欠取次數</th>
                  <th class="py-2.5 px-3">借用權限狀態</th>
                  <th class="py-2.5 px-3">停借截止日期</th>
                  <th class="py-2.5 px-3 text-center">操作</th>
                </tr>
              </thead>
              <tbody id="adminTeachersTable" class="divide-y divide-slate-100">
                <!-- 動態生成 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= 頁籤 3：全校物資總量設定 ================= -->
    <section id="tab-resources" class="tab-content hidden max-w-xl mx-auto">
      <div class="bg-white p-6 rounded-xl shadow-xs border border-slate-200 space-y-5">
        <div>
          <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-cubes text-indigo-600"></i> 物資總數量直接調配
          </h3>
          <p class="text-xs text-slate-500 mt-1">此處修改後，前台預約系統各節庫存基準將會即時連動生效。</p>
        </div>

        <form onsubmit="updateResourcesStock(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">全校 iPad 基準總數 (部)</label>
            <input type="number" id="adminIpadStock" min="1" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 font-bold text-indigo-700">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">全校 Mobile 基準總數 (部)</label>
            <input type="number" id="adminMobileStock" min="1" required class="w-full px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 font-bold text-purple-700">
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold py-2.5 rounded-lg shadow-sm transition">
            <i class="fa-solid fa-floppy-disk mr-1"></i> 儲存並即時套用全校
          </button>
        </form>
      </div>
    </section>

  </main>

  <script>
    // ================= 1. Supabase 連線設定 =================
    const SUPABASE_URL = 'https://gvysbmflwfidmifwepxz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2eXNibWZsd2ZpZG1pZndlcHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNzM4OTEsImV4cCI6MjEwNDg0OTg5MX0.7W8fBnbmZ6nOWpZohPvo_zCprZ7Ef0jvbG11iJrywrU';

    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentAdminUser = null;

    const LESSON_NAMES = { 1: '第 1 節', 2: '第 2 節', 3: '第 3 節', 4: '第 4 節', 5: '第 5 節', 6: '第 6 節', 7: '放學' };

    // ================= 2. 認證與初始化 =================
    document.addEventListener('DOMContentLoaded', async () => {
      const dateInput = document.getElementById('adminQueryDate');
      dateInput.value = getTodayString();
      dateInput.addEventListener('change', loadAdminBookings);

      // 初次檢查登入
      await verifyAdminAuth();

      // 🌟 即時監聽 Google OAuth 跳轉完成
      _supabase.auth.onAuthStateChange(async (event, session) => {
        await verifyAdminAuth();
      });
    });

    function getTodayString() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
    }

    async function verifyAdminAuth() {
      if (!_supabase) return;

      const { data: { session } } = await _supabase.auth.getSession();
      currentAdminUser = session?.user || null;

      const adminEmailDisplay = document.getElementById('adminEmailDisplay');
      const accessDeniedBlock = document.getElementById('accessDeniedBlock');
      const adminMainContent = document.getElementById('adminMainContent');

      let isAdmin = false;
      if (currentAdminUser && currentAdminUser.email) {
        // 向 admins 表查詢
        try {
          const { data, error } = await _supabase
            .from('admins')
            .select('email')
            .ilike('email', currentAdminUser.email.trim());
          isAdmin = !error && data && data.length > 0;
        } catch (e) {
          console.error("查詢 admins 出錯:", e);
        }
      }

      if (isAdmin) {
        adminEmailDisplay.textContent = currentAdminUser.email;
        accessDeniedBlock.classList.add('hidden');
        adminMainContent.classList.remove('hidden');

        loadAdminBookings();
        loadAdminTeachers();
        loadAdminResources();
      } else {
        adminEmailDisplay.textContent = currentAdminUser ? currentAdminUser.email : '未登入';
        accessDeniedBlock.classList.remove('hidden');
        adminMainContent.classList.add('hidden');
      }
    }

    async function loginWithGoogle() {
      const { error } = await _supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
          queryParams: { prompt: 'select_account' },
          redirectTo: window.location.href
        }
      });
      if (error) alert('登入失敗：' + error.message);
    }

    async function logout() {
      await _supabase.auth.signOut();
      location.reload();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => {
        el.classList.remove('border-indigo-600', 'text-indigo-600', 'font-bold');
        el.classList.add('border-transparent', 'text-slate-500');
      });

      document.getElementById(tabId).classList.remove('hidden');
      const activeBtn = document.getElementById(`tabBtn-${tabId.replace('tab-', '')}`);
      activeBtn.classList.add('border-indigo-600', 'text-indigo-600', 'font-bold');
      activeBtn.classList.remove('border-transparent', 'text-slate-500');
    }

    // ================= 3. 借還審核 =================
    async function loadAdminBookings() {
      const selectedDate = document.getElementById('adminQueryDate').value;
      const { data, error } = await _supabase
        .from('bookings')
        .select('*')
        .eq('date', selectedDate)
        .order('lesson', { ascending: true });

      const tbody = document.getElementById('adminBookingsTable');
      const emptyMsg = document.getElementById('adminEmptyBookings');
      tbody.innerHTML = '';

      if (error || !data || data.length === 0) {
        emptyMsg.classList.remove('hidden');
        updateStatusCounters([]);
        return;
      }
      emptyMsg.classList.add('hidden');
      updateStatusCounters(data);

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition";

        let statusBadge = '<span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded font-semibold">待取機</span>';
        if (item.status === 'borrowed') statusBadge = '<span class="px-2 py-0.5 bg-blue-100 text-blue-800 rounded font-semibold">已借出</span>';
        if (item.status === 'returned') statusBadge = '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-semibold">已歸還</span>';
        if (item.status === 'missed') statusBadge = '<span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded font-semibold">欠取機</span>';

        tr.innerHTML = `
          <td class="py-3 px-4 font-bold text-slate-800">${LESSON_NAMES[item.lesson]}</td>
          <td class="py-3 px-4 font-semibold text-indigo-700">${item.teacher_name}</td>
          <td class="py-3 px-4 font-bold">${item.device_type} × ${item.quantity}</td>
          <td class="py-3 px-4">${item.class} · ${item.subject} (${item.room})</td>
          <td class="py-3 px-4 text-slate-400 font-mono text-[11px]">${item.user_email || '無記錄'}</td>
          <td class="py-3 px-4">${statusBadge}</td>
          <td class="py-3 px-4 text-center space-x-1">
            <button onclick="updateBookingStatus('${item.id}', 'borrowed')" class="px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded font-medium transition" title="標記為已取機">
              <i class="fa-solid fa-box-open"></i> 已取
            </button>
            <button onclick="updateBookingStatus('${item.id}', 'returned')" class="px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded font-medium transition" title="標記為已歸還">
              <i class="fa-solid fa-circle-check"></i> 歸還
            </button>
            <button onclick="markAsMissed('${item.id}', '${item.teacher_name}')" class="px-2 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded font-medium transition" title="標記為欠取機並自動累加欠取次數">
              <i class="fa-solid fa-triangle-exclamation"></i> 欠取
            </button>
            <button onclick="deleteBookingAdmin('${item.id}')" class="p-1 text-slate-400 hover:text-rose-600 transition" title="強制刪除此記錄">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateStatusCounters(list) {
      document.getElementById('countPending').textContent = list.filter(i => i.status === 'pending').length;
      document.getElementById('countBorrowed').textContent = list.filter(i => i.status === 'borrowed').length;
      document.getElementById('countReturned').textContent = list.filter(i => i.status === 'returned').length;
      document.getElementById('countMissed').textContent = list.filter(i => i.status === 'missed').length;
    }

    async function updateBookingStatus(bookingId, status) {
      await _supabase.from('bookings').update({ status }).eq('id', bookingId);
      loadAdminBookings();
    }

    async function markAsMissed(bookingId, teacherName) {
      if (!confirm(`確定要將 ${teacherName} 的此筆記錄標記為「欠取機」嗎？\n系統將自動為該老師累加 1 次欠取次數！`)) return;

      await _supabase.from('bookings').update({ status: 'missed' }).eq('id', bookingId);

      const { data: teacher } = await _supabase.from('teachers').select('missed_count').eq('name', teacherName).single();

      if (teacher) {
        const newCount = (teacher.missed_count || 0) + 1;
        const autoSuspend = newCount >= 2;
        await _supabase.from('teachers').update({ missed_count: newCount, is_suspended: autoSuspend ? true : undefined }).eq('name', teacherName);
        alert(`已標記為欠取！${teacherName} 老師累計欠取次數更新為 ${newCount} 次。` + (autoSuspend ? '\n⚠️ 該老師欠取滿 2 次，已自動加入停借名單！' : ''));
      }

      loadAdminBookings();
      loadAdminTeachers();
    }

    async function deleteBookingAdmin(id) {
      if (!confirm('管理員確定要強制刪除此借用記錄嗎？')) return;
      await _supabase.from('bookings').delete().eq('id', id);
      loadAdminBookings();
    }

    // ================= 4. 教師欠取與黑名單管理 =================
    async function loadAdminTeachers() {
      const { data } = await _supabase.from('teachers').select('*');
      const tbody = document.getElementById('adminTeachersTable');
      tbody.innerHTML = '';
      if (!data) return;

      data.sort((a, b) => (b.is_suspended - a.is_suspended) || (b.missed_count - a.missed_count));

      const suspendedTotal = data.filter(t => t.is_suspended).length;
      document.getElementById('suspendedCount').textContent = `${suspendedTotal} 位停借中`;

      data.forEach(t => {
        const tr = document.createElement('tr');
        tr.className = t.is_suspended ? "bg-rose-50/40" : "hover:bg-slate-50";
        tr.innerHTML = `
          <td class="py-2.5 px-3 font-semibold text-slate-800">${t.name}</td>
          <td class="py-2.5 px-3 font-bold ${t.missed_count > 0 ? 'text-rose-600' : 'text-slate-500'}">${t.missed_count || 0} 次</td>
          <td class="py-2.5 px-3">${t.is_suspended ? '<span class="px-2 py-0.5 bg-rose-100 text-rose-700 rounded font-bold">⛔ 暫停借用中</span>' : '<span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded font-medium">正常</span>'}</td>
          <td class="py-2.5 px-3 font-mono text-[11px]">${t.suspended_until || '--'}</td>
          <td class="py-2.5 px-3 text-center space-x-1">
            ${t.is_suspended ? `
              <button onclick="toggleTeacherSuspend('${t.name}', false)" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-medium transition">
                <i class="fa-solid fa-lock-open mr-1"></i> 解除停借
              </button>
            ` : `
              <button onclick="promptSuspend('${t.name}')" class="px-2 py-1 bg-rose-100 hover:bg-rose-200 text-rose-700 border border-rose-300 rounded font-medium transition">
                <i class="fa-solid fa-ban mr-1"></i> 設為停借
              </button>
            `}
            <button onclick="resetMissedCount('${t.name}')" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded transition">清零</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function toggleTeacherSuspend(teacherName, isSuspended, untilDate = null) {
      await _supabase.from('teachers').update({ is_suspended: isSuspended, suspended_until: untilDate }).eq('name', teacherName);
      loadAdminTeachers();
    }

    function promptSuspend(teacherName) {
      const untilDate = prompt(`請輸入 ${teacherName} 的停借截止日期 (格式: YYYY-MM-DD)：`, '');
      toggleTeacherSuspend(teacherName, true, untilDate || null);
    }

    async function resetMissedCount(teacherName) {
      if (!confirm(`確定要將 ${teacherName} 的欠取次數重設為 0 次嗎？`)) return;
      await _supabase.from('teachers').update({ missed_count: 0 }).eq('name', teacherName);
      loadAdminTeachers();
    }

    async function addNewTeacher(event) {
      event.preventDefault();
      const name = document.getElementById('newTeacherName').value.trim();
      if (!name) return;

      const { error } = await _supabase.from('teachers').insert([{ name, missed_count: 0, is_suspended: false }]);
      if (error) alert('新增失敗：' + error.message);
      else {
        alert(`已成功新增 ${name} 老師！`);
        document.getElementById('newTeacherName').value = '';
        loadAdminTeachers();
      }
    }

    // ================= 5. 全校物資設定 (直讀直寫) =================
    async function loadAdminResources() {
      const { data } = await _supabase.from('resources').select('*');
      if (data) {
        data.forEach(r => {
          if (r.name === 'iPad') document.getElementById('adminIpadStock').value = r.total_qty;
          if (r.name === 'Mobile') document.getElementById('adminMobileStock').value = r.total_qty;
        });
      }
    }

    async function updateResourcesStock(event) {
      event.preventDefault();
      const ipadVal = parseInt(document.getElementById('adminIpadStock').value);
      const mobileVal = parseInt(document.getElementById('adminMobileStock').value);

      const res1 = await _supabase.from('resources').update({ total_qty: ipadVal }).eq('name', 'iPad');
      const res2 = await _supabase.from('resources').update({ total_qty: mobileVal }).eq('name', 'Mobile');

      if (res1.error || res2.error) alert('❌ 儲存失敗：' + (res1.error?.message || res2.error?.message));
      else alert('✅ 全校物資總量已成功更新！前台已即時同步套用新上限。');
    }
    // ==========================================
// 🌟 新增功能：全校物資總量與前台即時同步
// ==========================================

let globalStock = { iPad: 0, Mobile: 0 }; // 儲存全校總量的全域變數

// 1. 從資料庫獲取當前設定的總量上限
async function fetchTotalResources() {
    try {
        const { data, error } = await _supabase
            .from('resources')
            .select('name, total_qty');

        if (error) throw error;

        data.forEach(item => {
            globalStock[item.name] = item.total_qty;
        });
        console.log('✅ 成功同步全校物資總量上限：', globalStock);
    } catch (err) {
        console.error('❌ 無法載入物資總量：', err.message);
    }
}

// 2. 動態計算特定時段的【扣除後剩餘量】
async function updateRemainingStock() {
    // 💡 這裡對應你前台 HTML 的欄位元件
    const deviceSelect = document.getElementById('deviceType') || document.querySelector('select[name="device_type"]');
    const lessonSelect = document.getElementById('borrowLesson') || document.querySelector('select[name="lesson"]');
    const quantityInput = document.getElementById('borrowQuantity') || document.querySelector('input[name="quantity"]');
    
    // 如果找不到元件就先跳出，避免程式壞掉
    if (!lessonSelect || !deviceSelect) return;

    const selectedDevice = deviceSelect.value || 'iPad'; 
    const selectedLesson = lessonSelect.value; 
    const targetDate = new Date().toISOString().split('T')[0]; // 當天日期 YYYY-MM-DD

    if (!selectedLesson) return;

    try {
        // 撈出當天、該課節、該設備已被預約的總量
        const { data, error } = await _supabase
            .from('bookings')
            .select('quantity')
            .eq('date', targetDate)
            .eq('lesson', selectedLesson)
            .eq('device_type', selectedDevice);

        if (error) throw error;

        // 計算已借出總數
        const borrowedQty = data.reduce((sum, item) => sum + (parseInt(item.quantity) || 0), 0);
        
        // 剩餘量 = 該設備總量 - 已借出量
        const currentTotal = globalStock[selectedDevice] || 0;
        const remainingQty = Math.max(0, currentTotal - borrowedQty);

        // 💡 尋找網頁上顯示「尚餘: --」的文字區塊並更新它
        // 這裡會嘗試尋找你畫面中包含 "尚餘" 或 "剩餘" 的文字元素
        const allLabels = document.querySelectorAll('label, span, div');
        allLabels.forEach(el => {
            if (el.textContent.includes('尚餘') || el.textContent.includes('剩餘')) {
                el.textContent = `尚餘: ${remainingQty}`;
            }
        });

        // 限制使用者最大只能輸入剩餘的數量
        if (quantityInput) quantityInput.max = remainingQty;

    } catch (err) {
        console.error('❌ 計算剩餘庫存失敗：', err.message);
    }
}

// 3. 連動 Supabase Realtime 監聽（當後台改動時，前台秒速同步）
function setupRealtimeSubscription() {
    if (!_supabase) return;
    _supabase
        .channel('public:resources')
        .on('postgres_changes', { 
            event: 'UPDATE', 
            schema: 'public', 
            table: 'resources' 
        }, async (payload) => {
            console.log('🔔 偵測到管理員變更了後台物資總量！', payload.new);
            const updatedResource = payload.new;
            globalStock[updatedResource.name] = updatedResource.total_qty;
            await updateRemainingStock(); // 馬上重新計算前台顯示
        })
        .subscribe();
}
