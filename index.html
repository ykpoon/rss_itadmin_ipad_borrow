<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學校 iPad & 設備借用預約系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖標庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導航列 -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-tablet-screen-button text-2xl text-indigo-200"></i>
        <div>
          <h1 class="text-xl font-bold tracking-tight">iPad / 設備借用管理系統</h1>
          <p class="text-xs text-indigo-200">即時庫存查詢與課節登記</p>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2 bg-indigo-800/60 px-3 py-1.5 rounded-lg border border-indigo-500/30">
          <i class="fa-regular fa-calendar text-indigo-300"></i>
          <label for="selectDate" class="text-xs font-medium text-indigo-200">查詢日期：</label>
          <input type="date" id="selectDate" class="bg-transparent text-white text-sm font-semibold focus:outline-none cursor-pointer">
        </div>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- 1. 各節設備剩餘量看板 -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
      <div class="flex flex-col md:flex-row md:items-center justify-between pb-4 mb-4 border-b border-slate-100 gap-2">
        <div>
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-chart-pie text-indigo-600"></i>
            各節設備剩餘量看板 (<span id="displaySelectedDate" class="text-indigo-600"></span>)
          </h2>
          <p class="text-xs text-slate-500 mt-0.5">全校總量基準：iPad 138 部｜Mobile 55 部</p>
        </div>
        <div class="flex items-center gap-4 text-xs">
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500"></span> 供應充足 (>30)</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500"></span> 緊張 (1-30)</span>
          <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500"></span> 額滿 (0)</span>
        </div>
      </div>

      <!-- 課節卡片網格 -->
      <div id="lessonsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-3">
        <!-- 課節卡片由 JS 動態生成 -->
      </div>
    </section>

    <!-- 2. 下方兩欄佈局 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- 左側：借用表單 -->
      <section class="lg:col-span-5 bg-white rounded-xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
          <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
          提交借用申請
        </h2>

        <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <!-- 借用老師 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">借用老師 <span class="text-rose-500">*</span></label>
              <select id="teacherSelect" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                <option value="" disabled selected>載入教師名單中...</option>
              </select>
            </div>
            <!-- 借用課節 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">借用課節 <span class="text-rose-500">*</span></label>
              <select id="lessonSelect" required onchange="updateRemainingPreview()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option value="1">第 1 節 (Lesson 1)</option>
                <option value="2">第 2 節 (Lesson 2)</option>
                <option value="3">第 3 節 (Lesson 3)</option>
                <option value="4">第 4 節 (Lesson 4)</option>
                <option value="5">第 5 節 (Lesson 5)</option>
                <option value="6">第 6 節 (Lesson 6)</option>
                <option value="7">放學 (After School)</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <!-- 設備種類 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">設備種類 <span class="text-rose-500">*</span></label>
              <select id="deviceType" required onchange="updateRemainingPreview()" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <option value="iPad">iPad (上限 138)</option>
                <option value="Mobile">Mobile (上限 55)</option>
              </select>
            </div>
            <!-- 借用數量 -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">
                借用數量 <span class="text-rose-500">*</span>
                <span id="stockBadge" class="text-[11px] font-normal text-indigo-600 ml-1">(尚餘: --)</span>
              </label>
              <input type="number" id="quantity" required min="1" max="138" placeholder="輸入數量" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <!-- 班別 (下拉選單) -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">班別 <span class="text-rose-500">*</span></label>
              <select id="className" required class="w-full px-2 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                <option value="" disabled selected>請選擇...</option>
                <option value="1A">1A</option><option value="1B">1B</option><option value="1C">1C</option><option value="1D">1D</option>
                <option value="2A">2A</option><option value="2B">2B</option><option value="2C">2C</option><option value="2D">2D</option>
                <option value="3A">3A</option><option value="3B">3B</option><option value="3C">3C</option><option value="3D">3D</option>
                <option value="4A">4A</option><option value="4B">4B</option><option value="4C">4C</option>
                <option value="5A">5A</option><option value="5B">5B</option><option value="5C">5C</option>
                <option value="6A">6A</option><option value="6B">6B</option><option value="6C">6C</option><option value="6D">6D</option>
                <option value="資源班">資源班</option>
              </select>
            </div>
            <!-- 科目 (下拉選單) -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">科目 <span class="text-rose-500">*</span></label>
              <select id="subject" required class="w-full px-2 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                <option value="" disabled selected>請選擇...</option>
                <option value="中文">中文</option><option value="英文">英文</option><option value="數學">數學</option>
                <option value="綜合科學">綜合科學</option><option value="物理">物理</option><option value="化學">化學</option><option value="生物">生物</option>
                <option value="地理">地理</option><option value="歷史">歷史</option><option value="中國歷史">中國歷史</option>
                <option value="電腦/創科科技">電腦/創科科技</option><option value="家政">家政</option><option value="視藝">視藝</option>
                <option value="音樂">音樂</option><option value="體育">體育</option><option value="旅遊與款待">旅遊與款待</option>
                <option value="經濟">經濟</option><option value="BAFS">BAFS</option><option value="APL">APL</option><option value="OLE">OLE</option>
                <option value="班主任節">班主任節</option><option value="其他">其他</option>
              </select>
            </div>
            <!-- 地點 / 房號 (下拉選單) -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">地點/房號 <span class="text-rose-500">*</span></label>
              <select id="room" required class="w-full px-2 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                <option value="" disabled selected>請選擇...</option>
                <option value="地理室">地理室</option><option value="ART I">ART I</option><option value="ART II">ART II</option>
                <option value="IS Lab">IS Lab</option><option value="Chem Lab">Chem Lab</option><option value="Phy Lab">Phy Lab</option>
                <option value="Bio Lab">Bio Lab</option><option value="創科天地">創科天地</option><option value="廚藝學堂">廚藝學堂</option>
                <option value="音樂室">音樂室</option><option value="圖書館">圖書館</option><option value="多用途室(一)">多用途室(一)</option>
                <option value="多用途室(二)">多用途室(二)</option><option value="禮堂">禮堂</option><option value="普通課室">普通課室</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">備註 / 特殊需求 (選填)</label>
            <input type="text" id="remarks" placeholder="如需 Apple Pencil 或特定充電箱等" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>

          <!-- 借用規則提示 -->
          <div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800 space-y-1">
            <p class="font-bold flex items-center gap-1">
              <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> 借用規則提醒：
            </p>
            <ul class="list-disc list-inside space-y-0.5 text-[11px] text-amber-700">
              <li>借用採取先到先得原則，超出尚餘數量則無法成功登記。</li>
              <li>使用完畢後請於當節結束或放學前準時歸還至圖書館。</li>
            </ul>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> 確認提交借用登記
          </button>
        </form>
      </section>

      <!-- 右側：當日借用清單 -->
      <section class="lg:col-span-7 bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i>
            當日借用詳情清單
          </h2>
          <span id="recordCount" class="text-xs bg-slate-100 text-slate-600 font-medium px-2.5 py-1 rounded-full">共 0 筆記錄</span>
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left text-xs text-slate-600">
            <thead class="bg-slate-50 text-slate-700 uppercase font-semibold border-b border-slate-200">
              <tr>
                <th class="py-2.5 px-3">課節</th>
                <th class="py-2.5 px-3">老師</th>
                <th class="py-2.5 px-3">設備 / 數量</th>
                <th class="py-2.5 px-3">班別 / 科目</th>
                <th class="py-2.5 px-3">地點</th>
                <th class="py-2.5 px-3 text-center">操作</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody" class="divide-y divide-slate-100 font-normal">
              <!-- 表格內容由 JS 動態生成 -->
            </tbody>
          </table>
          <div id="emptyMessage" class="hidden text-center py-12 text-slate-400">
            <i class="fa-solid fa-inbox text-3xl mb-2"></i>
            <p class="text-sm">本日該時段暫無任何借用記錄</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
    學校 IT 資訊科技組 · iPad & 行動設備借用管理系統
  </footer>

  <script>
    // ================= 1. Supabase 連線設定 =================
    // ⚠️ 請在此處填入您真正的 Supabase 專案網址與 Anon 金鑰
    const SUPABASE_URL = 'https://gvysbmflwfidmifwepxz.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2eXNibWZsd2ZpZG1pZndlcHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNzM4OTEsImV4cCI6MjEwNDg0OTg5MX0.7W8fBnbmZ6nOWpZohPvo_zCprZ7Ef0jvbG11iJrywrU';
    
    let supabase = null;
    let isSupabaseConnected = false;

    // 嘗試建立與 Supabase 的連線
    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes('替換成你的') && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('替換成你的')) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        isSupabaseConnected = true;
        console.log("Supabase 連線成功！");
      }
    } catch (e) {
      console.warn("Supabase 尚未設定或設定錯誤，切換至本地模擬模式", e);
    }

    const TOTAL_STOCK = { iPad: 138, Mobile: 55 };
    const LESSON_NAMES = { 1: '第 1 節', 2: '第 2 節', 3: '第 3 節', 4: '第 4 節', 5: '第 5 節', 6: '第 6 節', 7: '放學' };

    // 本地預設的模擬教師數據 (避免連不上的時候卡死)
    const backupTeachers = [
      { name: "區永裕", is_suspended: false },
      { name: "陳大文", is_suspended: false },
      { name: "潘老師", is_suspended: false },
      { name: "莊銘澄", is_suspended: false },
      { name: "李凌玲", is_suspended: false },
      { name: "袁小敏", is_suspended: false },
      { name: "江毅珊", is_suspended: false },
      { name: "周貝兒", is_suspended: true, suspended_until: "2026-03-31" } // 模擬停借狀態
    ];

    // 本地模擬的借用紀錄
    let backupBookings = [
      { id: '1', date: getTodayString(), lesson: 1, teacher_name: '潘老師', device_type: 'iPad', quantity: 35, class: '1A', subject: '電腦/創科科技', room: '創科天地' },
      { id: '2', date: getTodayString(), lesson: 1, teacher_name: '陳大文', device_type: 'iPad', quantity: 30, class: '2B', subject: '英文', room: '普通課室' },
      { id: '3', date: getTodayString(), lesson: 2, teacher_name: '李凌玲', device_type: 'iPad', quantity: 35, class: '3C', subject: '數學', room: '多用途室(一)' }
    ];

    let currentBookings = [];
    let teachersList = [];

    // ================= 2. 頁面初始化 =================
    document.addEventListener('DOMContentLoaded', () => {
      const dateInput = document.getElementById('selectDate');
      dateInput.value = getTodayString();
      dateInput.addEventListener('change', fetchAndRender);

      // 同時加載名單與看板數據
      loadTeachers();
      fetchAndRender();
      setupRealtimeSubscription();
    });

    function getTodayString() {
      return new Date().toISOString().split('T')[0];
    }

    // 開啟 Realtime 即時廣播
    function setupRealtimeSubscription() {
      if (!isSupabaseConnected) return;
      supabase
        .channel('public:bookings')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => {
          fetchAndRender();
        })
        .subscribe();

      supabase
        .channel('public:teachers')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'teachers' }, () => {
          loadTeachers();
        })
        .subscribe();
    }

    // ================= 3. 載入教師名單 =================
    async function loadTeachers() {
      const select = document.getElementById('teacherSelect');
      
      if (isSupabaseConnected) {
        const { data, error } = await supabase
          .from('teachers')
          .select('name, is_suspended, suspended_until')
          .order('name', { ascending: true });

        if (!error && data) {
          teachersList = data;
        } else {
          console.warn("從 Supabase 讀取教師名單失敗，使用備用教師名單", error);
          teachersList = backupTeachers;
        }
      } else {
        teachersList = backupTeachers;
      }

      select.innerHTML = '<option value="" disabled selected>請選擇老師姓名...</option>';
      teachersList.forEach(teacher => {
        const option = document.createElement('option');
        option.value = teacher.name;

        if (teacher.is_suspended) {
          const until = teacher.suspended_until ? `至 ${teacher.suspended_until}` : '';
          option.textContent = `⛔ ${teacher.name} (暫停借用 ${until})`.trim();
          option.disabled = true;
          option.classList.add('text-rose-500');
        } else {
          option.textContent = teacher.name;
        }
        select.appendChild(option);
      });
    }

    // ================= 4. 讀取與計算庫存 =================
    async function fetchAndRender() {
      const selectedDate = document.getElementById('selectDate').value;
      document.getElementById('displaySelectedDate').textContent = selectedDate;

      if (isSupabaseConnected) {
        const { data, error } = await supabase
          .from('bookings')
          .select('*')
          .eq('date', selectedDate);

        if (!error && data) {
          currentBookings = data;
        } else {
          console.warn("從 Supabase 讀取借用紀錄失敗，使用備用借用記錄", error);
          currentBookings = backupBookings.filter(b => b.date === selectedDate);
        }
      } else {
        currentBookings = backupBookings.filter(b => b.date === selectedDate);
      }

      renderDashboard();
      renderTable();
      updateRemainingPreview();
    }

    function getRemainingStock(lesson, device) {
      const borrowed = currentBookings
        .filter(b => b.lesson === parseInt(lesson) && b.device_type === device)
        .reduce((sum, b) => sum + b.quantity, 0);
      return Math.max(0, TOTAL_STOCK[device] - borrowed);
    }

    function updateRemainingPreview() {
      const lesson = document.getElementById('lessonSelect').value;
      const device = document.getElementById('deviceType').value;
      const remaining = getRemainingStock(lesson, device);

      document.getElementById('stockBadge').textContent = `(尚餘: ${remaining} 部)`;
      document.getElementById('quantity').max = remaining;
    }

    // ================= 5. 介面渲染 =================
    function renderDashboard() {
      const grid = document.getElementById('lessonsGrid');
      grid.innerHTML = '';

      for (let l = 1; l <= 7; l++) {
        const remIpad = getRemainingStock(l, 'iPad');
        const remMobile = getRemainingStock(l, 'Mobile');

        const ipadColor = remIpad > 30 ? 'text-emerald-600 bg-emerald-50 border-emerald-200' : (remIpad > 0 ? 'text-amber-600 bg-amber-50 border-amber-200' : 'text-rose-600 bg-rose-50 border-rose-200');
        const mobileColor = remMobile > 15 ? 'text-emerald-600 bg-emerald-50 border-emerald-200' : (remMobile > 0 ? 'text-amber-600 bg-amber-50 border-amber-200' : 'text-rose-600 bg-rose-50 border-rose-200');

        const card = document.createElement('div');
        card.className = "bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex flex-col justify-between shadow-xs";
        card.innerHTML = `
          <div class="text-xs font-bold text-slate-700 mb-1.5 pb-1 border-b border-slate-200 flex justify-between items-center">
            <span>${LESSON_NAMES[l]}</span>
          </div>
          <div class="space-y-1 text-[11px]">
            <div class="flex items-center justify-between px-1.5 py-0.5 rounded border ${ipadColor}">
              <span class="font-medium">iPad</span>
              <span class="font-bold">${remIpad} / ${TOTAL_STOCK.iPad}</span>
            </div>
            <div class="flex items-center justify-between px-1.5 py-0.5 rounded border ${mobileColor}">
              <span class="font-medium">Mobile</span>
              <span class="font-bold">${remMobile} / ${TOTAL_STOCK.Mobile}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('bookingsTableBody');
      const emptyMsg = document.getElementById('emptyMessage');
      const countBadge = document.getElementById('recordCount');

      countBadge.textContent = `共 ${currentBookings.length} 筆記錄`;
      tbody.innerHTML = '';

      if (currentBookings.length === 0) {
        emptyMsg.classList.remove('hidden');
        return;
      }
      emptyMsg.classList.add('hidden');

      currentBookings.sort((a, b) => a.lesson - b.lesson);
      currentBookings.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/80 transition";
        tr.innerHTML = `
          <td class="py-2.5 px-3 font-semibold text-slate-800">${LESSON_NAMES[item.lesson]}</td>
          <td class="py-2.5 px-3 font-medium text-indigo-700">${item.teacher_name}</td>
          <td class="py-2.5 px-3 text-slate-700 font-semibold">
            <span class="${item.device_type === 'iPad' ? 'text-blue-600' : 'text-purple-600'}">
              ${item.device_type} × ${item.quantity}
            </span>
          </td>
          <td class="py-2.5 px-3">${item.class} (${item.subject})</td>
          <td class="py-2.5 px-3">${item.room}</td>
          <td class="py-2.5 px-3 text-center">
            <button onclick="deleteBooking('${item.id}')" class="text-rose-500 hover:text-rose-700 p-1 transition" title="取消登記">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ================= 6. 提交借用表單 =================
    async function handleFormSubmit(event) {
      event.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在儲存...';

      const date = document.getElementById('selectDate').value;
      const lesson = parseInt(document.getElementById('lessonSelect').value);
      const teacher_name = document.getElementById('teacherSelect').value;
      const device_type = document.getElementById('deviceType').value;
      const quantity = parseInt(document.getElementById('quantity').value);
      const className = document.getElementById('className').value;
      const subject = document.getElementById('subject').value;
      const room = document.getElementById('room').value;
      const remarks = document.getElementById('remarks').value.trim();

      if (!teacher_name) {
        alert('請先選擇借用老師！');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 確認提交借用登記';
        return;
      }

      // 檢查黑名單
      const teacherRecord = teachersList.find(t => t.name === teacher_name);
      if (teacherRecord && teacherRecord.is_suspended) {
        alert(`❌ 借用失敗：${teacher_name} 老師目前處於停止借用期！`);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 確認提交借用登記';
        return;
      }

      const remaining = getRemainingStock(lesson, device_type);
      if (quantity > remaining) {
        alert(`❌ 借用失敗！該節 ${device_type} 尚餘數量僅剩 ${remaining} 部。`);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 確認提交借用登記';
        return;
      }

      if (isSupabaseConnected) {
        const { error } = await supabase.from('bookings').insert([{
          date, lesson, teacher_name, device_type, quantity, class: className, subject, room, remarks, status: 'pending'
        }]);

        if (error) {
          alert('登記失敗：' + error.message);
        } else {
          alert(`✅ 借用成功！已為 ${teacher_name} 登記 ${LESSON_NAMES[lesson]} 的 ${device_type} (${quantity} 部)。`);
          document.getElementById('bookingForm').reset();
          fetchAndRender();
        }
      } else {
        // 本地模擬模式直接新增到備用陣列
        const newMock = {
          id: Date.now().toString(), date, lesson, teacher_name, device_type, quantity, class: className, subject, room, remarks
        };
        backupBookings.push(newMock);
        alert(`✅ [本地測試] 借用成功！已為 ${teacher_name} 登記 ${LESSON_NAMES[lesson]} 的 ${device_type} (${quantity} 部)。`);
        document.getElementById('bookingForm').reset();
        fetchAndRender();
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> 確認提交借用登記';
    }

    // ================= 7. 取消借用 =================
    async function deleteBooking(id) {
      if (!confirm('確定要取消此借用記錄嗎？釋出的數量將即時回補。')) return;

      if (isSupabaseConnected) {
        const { error } = await supabase.from('bookings').delete().eq('id', id);
        if (error) {
          alert('刪除失敗：' + error.message);
        } else {
          fetchAndRender();
        }
      } else {
        backupBookings = backupBookings.filter(b => b.id !== id);
        fetchAndRender();
        alert('✅ [本地測試] 借用已取消。');
      }
    }
  </script>
</body>
